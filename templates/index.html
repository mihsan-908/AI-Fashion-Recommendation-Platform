<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fashion Recommender</title>
    
    <!-- Scripts & Fonts -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sora: ['Sora', 'sans-serif'],
                        mono: ['Space Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        html, body { height: 100%; margin: 0; }
        .app-wrapper { height: 100%; overflow: auto; }
        
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .animated-bg {
            background: linear-gradient(135deg, #1a1410 0%, #2d1f15 25%, #3d2418 50%, #2a1814 75%, #16100c 100%);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
        }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .nav-link {
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #f5a623, #ff6b6b);
            transition: width 0.3s ease;
            border-radius: 2px;
        }
        
        .nav-link:hover::after { width: 100%; }
        .nav-link:hover { color: #f5a623; }
        
        .brand-glow {
            text-shadow: 0 0 40px rgba(245, 166, 35, 0.3);
        }
        
        .accent-dot {
            width: 8px; height: 8px;
            background: #f5a623;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(245, 166, 35, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        .slide-up { animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; }

        .hero-container {
            height: calc(100% - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 600px;
            z-index: 10;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #f5a623, #ff6b6b, #f5a623);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-flow 3s ease infinite;
        }

        @keyframes gradient-flow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #f5a623, #ff6b6b);
            color: white;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(245, 166, 35, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(245, 166, 35, 0.4);
        }

        .floating-cards {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .card {
            position: absolute;
            width: 200px;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(245, 166, 35, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            opacity: 0.6;
        }

        .card-1 { top: 10%; left: 5%; animation: float 6s ease-in-out infinite; }
        .card-2 { top: 60%; right: 8%; animation: float 8s ease-in-out infinite reverse; }
        .card-3 { top: 30%; right: 15%; animation: float 7s ease-in-out infinite; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(2deg); }
            50% { transform: translateY(-20px) rotate(-2deg); }
        }
    </style>
</head>
<body class="app-wrapper animated-bg font-sora text-gray-100">

    <!-- Navigation -->
    <nav class="glass-nav sticky top-0 z-50 fade-in">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="accent-dot"></div>
                <h2 class="text-xl font-bold tracking-tight brand-glow font-mono">🧠 AI Fashion</h2>
            </div>
            
            <div class="flex items-center gap-6">
                <a href="{{ url_for('home') }}" class="nav-link text-sm font-medium text-gray-300 flex items-center gap-1.5"> 
                    <i data-lucide="home" class="w-4 h-4"></i> Home 
                </a> 
                <a href="{{ url_for('chat') }}" class="nav-link text-sm font-medium text-gray-300 flex items-center gap-1.5"> 
                    <i data-lucide="message-circle" class="w-4 h-4"></i> Chat 
                </a> 
                <a href="{{ url_for('saved') }}" class="nav-link text-sm font-medium text-gray-300 flex items-center gap-1.5"> 
                    <i data-lucide="bookmark" class="w-4 h-4"></i> Saved 
                </a> 
                <a href="{{ url_for('login') }}" class="nav-link text-sm font-medium px-4 py-2 rounded-full border border-[#f5a623]/40 text-[#f5a623] hover:bg-[#f5a623] hover:text-white transition-all duration-300 flex items-center gap-1.5"> 
                    <i data-lucide="log-in" class="w-4 h-4"></i> Login 
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-container">
        <div class="floating-cards">
            <div class="card card-1"></div>
            <div class="card card-2"></div>
            <div class="card card-3"></div>
        </div>
        
        <div class="hero-content slide-up">
            <h1 class="hero-title">Elevate Your Style</h1>
            <p class="hero-subtitle">Get AI-powered fashion recommendations tailored just for you. Upload outfits and discover your perfect look.</p>
            
            <a href="{{ url_for('chat') }}" class="cta-button"> 
                <i data-lucide="sparkles" class="w-5 h-5"></i> 
                <span>Start Styling</span> 
            </a>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
